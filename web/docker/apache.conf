<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Fonts can be loaded from other origins. Apple Mail only shows the web fonts in our emails
    # when the font response allows it (CORS).
    <FilesMatch "\.woff2$">
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>

    # Logs go to the container's stdout/stderr (the official image links these files there).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
